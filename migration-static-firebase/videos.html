<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="index,follow">
    <title>যুগান্তর ভিডিও</title>
    <link rel="icon" href="./yugantar-logo.jpg">
    <link rel="stylesheet" href="./styles.css?v=20261024-bengali-only">
  </head>
  <body>
    <header class="site-header"><div class="shell header-row"><a class="brand" href="./index.html"><span class="brand-mark"><img src="./yugantar-logo.jpg" alt="যুগান্তর লোগো"></span><span class="brand-copy"><strong>YUGANTAR <em>ভিডিও</em></strong><small>অফিসিয়াল চ্যানেল আর্কাইভ</small></span></a><div class="header-actions"><a class="button button-muted" href="./index.html">নিউজরুমে ফিরুন</a></div></div></header>
    <main class="shell content-section">
      <div class="section-heading">
        <div>
          <div class="section-kicker">অফিসিয়াল সোশ্যাল</div>
          <h1>সব চ্যানেল ভিডিও</h1>
          <p class="section-intro">অফিসিয়াল ইউটিউব আপলোডগুলি দেখুন। পরবর্তী নির্ধারিত সিঙ্কের পর নতুন ভিডিও এখানে দেখা যাবে।</p>
        </div>
        <label class="search-box">
          <span class="sr-only">ভিডিও খুঁজুন</span>
          <span class="search-icon">⌕</span>
          <input id="video-search" type="search" placeholder="ভিডিও খুঁজুন…">
        </label>
      </div>
      <div id="all-videos" class="video-grid"><div class="empty-state">ভিডিও লোড হচ্ছে…</div></div>
      <div class="pagination-actions">
        <button id="previous-page" class="button button-muted" type="button" disabled>আগের পৃষ্ঠা</button>
        <span id="page-status" class="muted">পৃষ্ঠা ১</span>
        <button id="next-page" class="button" type="button" disabled>পরের পৃষ্ঠা</button>
      </div>
      <p id="videos-status" class="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./videos.js?v=20261024-bengali-only"></script>
  </body>
</html>
