<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="index,follow">
    <title>YUGANTAR Videos</title>
    <link rel="icon" href="./yugantar-logo.jpg">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <header class="site-header"><div class="shell header-row"><a class="brand" href="./index.html"><span class="brand-mark"><img src="./yugantar-logo.jpg" alt="YUGANTAR logo"></span><span class="brand-copy"><strong>YUGANTAR <em>VIDEOS</em></strong><small>OFFICIAL CHANNEL ARCHIVE</small></span></a><div class="header-actions"><a class="button button-muted" href="./index.html">Back to newsroom</a></div></div></header>
    <main class="shell content-section">
      <div class="section-heading">
        <div>
          <div class="section-kicker">OFFICIAL SOCIAL</div>
          <h1>All channel videos</h1>
          <p class="section-intro">Browse the available official YouTube uploads. New uploads appear after the next scheduled sync.</p>
        </div>
        <label class="search-box">
          <span class="sr-only">Search videos</span>
          <span class="search-icon">⌕</span>
          <input id="video-search" type="search" placeholder="Search videos...">
        </label>
      </div>
      <div id="all-videos" class="video-grid"><div class="empty-state">Loading videos…</div></div>
      <div class="pagination-actions">
        <button id="previous-page" class="button button-muted" type="button" disabled>Previous</button>
        <span id="page-status" class="muted">Page 1</span>
        <button id="next-page" class="button" type="button" disabled>Next</button>
      </div>
      <p id="videos-status" class="status" aria-live="polite"></p>
    </main>
    <script type="module" src="./videos.js"></script>
  </body>
</html>
